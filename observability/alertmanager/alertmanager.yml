# Alertmanager for the DockerMonitoring stack.
#
# Out of the box the receivers have no integrations, so alerts are grouped,
# deduplicated and shown in the Alertmanager UI but sent nowhere. To deliver
# them, add a slack_configs / webhook_configs / email_configs block to a
# receiver (example at the bottom).

route:
  receiver: default
  group_by: [alertname, container, instance]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      repeat_interval: 1h
    - matchers: [severity="info"]
      receiver: default
      group_interval: 30m
      repeat_interval: 24h

inhibit_rules:
  # A target that is down explains every other alert from the same instance.
  - source_matchers: [alertname="MonitoringTargetDown"]
    target_matchers: [alertname!="MonitoringTargetDown"]
    equal: [instance]
  # The ongoing alert already covers the same container and syscall.
  - source_matchers: [alertname="UnexpectedSyscallOngoing"]
    target_matchers: [alertname="UnexpectedSyscallObserved"]
    equal: [container, syscall]
  # Without events, coverage and parse-error alerts carry no information.
  - source_matchers: [alertname=~"SeccompEventStreamStalled|SeccompNoEventsSinceStart"]
    target_matchers: [alertname=~"SeccompProfileMostlyUnused|SeccompEventParseErrors"]
    equal: [instance]

receivers:
  - name: default
  - name: critical
